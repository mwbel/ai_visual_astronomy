<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>太阳黄经与四季节点</title>
  <link rel="stylesheet" href="/app/modules/common/styles.css" />
  <style>
    .panel { display:grid; grid-template-columns: 1fr 2fr; gap: 16px; }
    .controls { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--card-bg-dark); }
    .controls .row { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
    .canvas-wrap { border: 1px solid var(--border); border-radius: 12px; padding: 8px; background: var(--card-bg-dark); }
    #plot { width: 100%; height: 560px; background:#0a0d12; border-radius:8px; }
    @media (max-width: 900px) { .panel { grid-template-columns: 1fr; } #plot { height: 460px; } }
  </style>
</head>
<body class="theme-dark">
  <header class="app-header">
    <h1>太阳黄经与四季节点</h1>
    <div class="header-actions"><a class="btn" href="/app/modules/tibetan_calendar/">返回模块主页</a></div>
  </header>
  <main class="container">
    <div id="topbar" class="topbar">
      <div id="backContainer" class="section"></div>
      <div id="locationContainer" class="section"></div>
      <div id="dateContainer" class="section"></div>
    </div>
    <section class="panel">
      <div class="controls">
        <div class="row">
          <label>黄经(°)：<input id="lon" type="range" min="0" max="360" value="0"/></label>
          <span id="lonLabel">0°</span>
        </div>
        <div class="row" style="color:var(--muted); font-size:14px;">
          春分(0°)、夏至(90°)、秋分(180°)、冬至(270°) 标记于黄道环。
        </div>
      </div>
      <div class="canvas-wrap"><div id="plot"></div></div>
    </section>
  </main>
  <footer class="app-footer">© 2025 Tibetan Calendar Visualization</footer>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="/app/modules/common/BackButton.js"></script>
  <script src="/app/modules/common/LocationSelector.js"></script>
  <script src="/app/modules/common/DateSelector.js"></script>
  <script>
    BackButton.renderBackButton('#backContainer','/app/modules/tibetan_calendar/');
    LocationSelector.renderLocationSelector('#locationContainer',{ url:'/data/cities.csv' });
    DateSelector.renderDateSelector('#dateContainer');

    const tilt=23.44*Math.PI/180;
    function eclipticRing(){ const X=[],Y=[],Z=[]; for(let k=0;k<=360;k++){ const t=Math.PI*k/180; const x=Math.cos(t); const y=Math.sin(t)*Math.cos(tilt); const z=Math.sin(t)*Math.sin(tilt); X.push(x);Y.push(y);Z.push(z);} return {X,Y,Z}; }
    function pointOnEcliptic(lon){ const t=lon*Math.PI/180; return { x:Math.cos(t), y:Math.sin(t)*Math.cos(tilt), z:Math.sin(t)*Math.sin(tilt) } }

    function render(lon){
      const {X,Y,Z}=eclipticRing();
      const traces=[
        {type:'scatter3d',x:X,y:Y,z:Z,mode:'lines',line:{color:'#f59e0b',width:4},name:'黄道'},
        {type:'scatter3d',x:[1,0,-1,0,1],y:[0,Math.cos(tilt),0,-Math.cos(tilt),0],z:[0,Math.sin(tilt),0,-Math.sin(tilt),0],mode:'lines',line:{color:'#78716c',dash:'dot'},name:'季节象限'},
      ];
      // 节点标记
      const nodes=[0,90,180,270]; const names=['春分','夏至','秋分','冬至'];
      for(let i=0;i<nodes.length;i++){ const p=pointOnEcliptic(nodes[i]); traces.push({type:'scatter3d',x:[p.x],y:[p.y],z:[p.z],mode:'markers+text',marker:{size:6,color:'#60a5fa'},text:[names[i]],textposition:'top center',name:names[i]}); }
      // 太阳位置
      const s=pointOnEcliptic(lon); traces.push({type:'scatter3d',x:[s.x],y:[s.y],z:[s.z],mode:'markers',marker:{size:8,color:'#fcd34d'},name:`太阳 ${lon.toFixed(1)}°`});

      const layout={ title:`太阳黄经 ${lon.toFixed(1)}°`, scene:{ xaxis:{title:'东(+)西(-)'}, yaxis:{title:'北(+)南(-)'}, zaxis:{title:'天顶(+)地心(-)'}, aspectmode:'cube', bgcolor:'rgb(0,0,0)' }, template:'plotly_dark', font:{ color:'#1E3A8A'} };
      Plotly.newPlot('plot', traces, layout);
    }

    const lonEl=document.getElementById('lon'); const lonLabel=document.getElementById('lonLabel');
    lonEl.addEventListener('input',()=>{ lonLabel.textContent=`${lonEl.value}°`; render(parseFloat(lonEl.value)); });
    render(0);
  </script>
</body>
</html>
